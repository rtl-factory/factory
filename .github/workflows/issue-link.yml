# Workflow rule: every pull request must close an issue (wiki/bkm/flow.md, ADR 0003).
name: issue-link

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read
  issues: read

jobs:
  issue-link:
    # Why: a fork's code never runs on the self-hosted runner (wiki/bkm/flow.md, Runners).
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON('["self-hosted","rtl-factory"]') }}
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const base = pr.base.ref;
            if (base === context.payload.repository.default_branch) {
              // Into main: GitHub must see at least one issue this PR will close.
              const q = `query($owner:String!,$repo:String!,$n:Int!){
                repository(owner:$owner,name:$repo){
                  pullRequest(number:$n){ closingIssuesReferences(first:10){ nodes{ number } } } } }`;
              const r = await github.graphql(q, { owner: context.repo.owner, repo: context.repo.repo, n: pr.number });
              const issues = r.repository.pullRequest.closingIssuesReferences.nodes.map(i => `#${i.number}`);
              if (issues.length === 0) {
                core.setFailed('This pull request closes no issue. Add "Closes #<issue>" to its description.');
              } else {
                core.info(`Closes ${issues.join(', ')}`);
              }
            } else {
              // Into an epic branch: GitHub only auto-links into the default branch, so check the text.
              const m = (pr.body || '').match(/\b(close[sd]?|fix(e[sd])?|resolve[sd]?)\s+#\d+/i);
              if (!m) core.setFailed('This pull request names no issue. Add "Closes #<issue>" to its description.');
              else core.info(`Found "${m[0]}"`);
            }
