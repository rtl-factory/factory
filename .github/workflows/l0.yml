# L0 regression (wiki/bkm/flow.md CI levels): the comment lint, the scripts'
# and tools' unit tests, every L0 simulation target and every L0 formal target
# (both through Bazel, cached), on Verilator, cocotb and the OSS CAD Suite at the
# versions pinned in cfg/toolchain.json, tools/sim/requirements_lock.txt and
# .bazelversion.
name: l0

on:
  pull_request:
    branches: [main, "epic/**"]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: l0-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  l0:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Comment lint
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          base=()
          if [ -n "$BASE_REF" ] && git fetch -q --depth=1 origin "$BASE_REF" \
             && git show FETCH_HEAD:tools/lint/comment_baseline.json > "$RUNNER_TEMP/base-baseline.json" 2>/dev/null; then
            base=(--base-baseline "$RUNNER_TEMP/base-baseline.json")
          fi
          python3 tools/lint/comment_lint.py "${base[@]}"

      - name: Read the Verilator pin
        id: pin
        run: |
          python3 -I -c 'import json; v = json.load(open("cfg/toolchain.json"))["verilator"]; [print(k + "=" + v[k]) for k in ("version", "tag", "repository")]' >> "$GITHUB_OUTPUT"

      - name: Restore Verilator
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/verilator
          key: verilator-${{ steps.pin.outputs.tag }}-${{ runner.os }}-ubuntu-24.04

      - name: Build Verilator
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bison flex libfl-dev help2man zlib1g-dev
          git clone --depth 1 --branch "${{ steps.pin.outputs.tag }}" "${{ steps.pin.outputs.repository }}" "$RUNNER_TEMP/verilator-src"
          cd "$RUNNER_TEMP/verilator-src"
          autoconf
          ./configure --prefix="$HOME/verilator"
          make -j"$(nproc)"
          make install

      - name: Put Verilator on PATH
        run: |
          echo "$HOME/verilator/bin" >> "$GITHUB_PATH"
          "$HOME/verilator/bin/verilator" --version

      - name: Install simulation host packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq liblz4-dev gcc-riscv64-unknown-elf picolibc-riscv64-unknown-elf

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/sim/requirements.txt
      - run: pip install -r tools/sim/requirements.txt

      - name: Unit tests (scripts and tools)
        run: python -m pytest -q src/*/scripts tools

      - name: Install the OSS CAD Suite (formal tools)
        run: |
          read -r url sum < <(python3 -I -c 'import json; v = json.load(open("cfg/toolchain.json"))["oss_cad_suite"]; print(v["url"], v["sha256"])')
          curl -fsSL --retry 4 -o "$RUNNER_TEMP/oss-cad-suite.tgz" "$url"
          echo "$sum  $RUNNER_TEMP/oss-cad-suite.tgz" | sha256sum -c -
          mkdir -p "$HOME/oss-cad-suite"
          tar -xzf "$RUNNER_TEMP/oss-cad-suite.tgz" -C "$HOME/oss-cad-suite" --strip-components=1
          rm "$RUNNER_TEMP/oss-cad-suite.tgz"
          python3 tools/toolchain/check.py --tool oss-cad-suite

      - name: Allow Bazel's sandbox
        # Why: Ubuntu 24.04 restricts the unprivileged user namespaces linux-sandbox uses.
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          repository-cache: true

      - name: Restore the Bazel disk cache
        # Why: models and test results survive between runs, so a change reruns only
        # what it touches (wiki/tools/bazel/spec.md). Keyed by commit so every run
        # saves its own and the next restores the newest.
        uses: actions/cache@v4
        with:
          path: ~/.cache/bazel-disk
          key: bazel-disk-l0-${{ runner.os }}-${{ github.sha }}
          restore-keys: bazel-disk-l0-${{ runner.os }}-

      - name: L0 simulation and formal targets
        run: bazel test --config=ci --config=l0 //src/...

      - name: Keep test logs and formal traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: |
            bazel-testlogs/**/test.log
            bazel-testlogs/**/test.outputs/**/*.vcd
            bazel-testlogs/**/test.outputs/**/logfile.txt
            bazel-testlogs/**/test.outputs/*.log
          if-no-files-found: ignore

