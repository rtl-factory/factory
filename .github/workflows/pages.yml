# Builds wiki/ into a site; deploys it to GitHub Pages on merges to main (wiki/bkm/layout.md).
name: pages

on:
  push:
    branches: [main]
    paths: [wiki/**, mkdocs.yml, tools/pages/**, .github/workflows/pages.yml]
  pull_request:
    paths: [wiki/**, mkdocs.yml, tools/pages/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  # Cancel superseded pull request builds, never a running deploy on main.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    # Why: an approved fork run goes to a throwaway GitHub-hosted runner; the approval,
    # not this expression, is what keeps a fork's code off the self-hosted one
    # (wiki/bkm/flow.md, Runners).
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || fromJSON('["self-hosted","rtl-factory"]') }}
    steps:
      - uses: actions/checkout@v4
      # Why: a fresh venv per run, so the self-hosted runner's own Python packages never leak in.
      - run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q -r tools/pages/requirements.txt
      - run: '"$RUNNER_TEMP/venv/bin/mkdocs" build --strict'
        env:
          NO_MKDOCS_2_WARNING: "1"
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: [self-hosted, rtl-factory]
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
