# Builds wiki/ into a site; deploys it to GitHub Pages on merges to main (wiki/bkm/workflow/wiki-site.md).
name: pages

on:
  push:
    branches: [main]
    paths: [wiki/**, mkdocs.yml, tools/pages/**, .github/workflows/pages.yml]
  pull_request:
    paths: [wiki/**, mkdocs.yml, tools/pages/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  # Cancel superseded pull request builds, never a running deploy on main.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/pages/requirements.txt
      - run: pip install -r tools/pages/requirements.txt
      - run: mkdocs build --strict
        env:
          NO_MKDOCS_2_WARNING: "1"
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
